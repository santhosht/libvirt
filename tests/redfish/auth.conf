# libvirt authentication file, used through LIBVIRT_AUTH_FILE (see rf).
#
# This sample matches the two local test servers. Both accept user "admin"
# with password "password" (the emulator accepts anything).

[credentials-local]
username=admin
password=password

[auth-redfish-127.0.0.1]
credentials=local

# For a real service add its own credentials, keyed by the host name used
# in the URI. Do not commit real passwords.
#
# [credentials-bmc]
# username=composer
# password=CHANGE-ME
#
# [auth-redfish-bmc.example.com]
# credentials=bmc
